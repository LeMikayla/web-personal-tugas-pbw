<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Personal Portfolio</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <section class="hero">
      <div class="hero-container">
        <!-- LEFT -->
        <div class="left">
          <p class="small-name">2408107010049</p>
          <h1>RAHIQUL</h1>
          <h1>MUNADHIL</h1>

          <div class="alert alert-info mt-3 p-2" style="font-size: 12px">
            Learning Web Development
          </div>
        </div>

        <!-- CENTER (CAROUSEL) -->
        <div class="center">
          <div id="heroCarousel" class="carousel slide">
            <div class="carousel-inner">
              <div class="carousel-item active text-center">
                <img src="img/photo.jpeg" class="d-block mx-auto" />
              </div>

              <div class="carousel-item text-center">
                <img src="img/photo2.jpeg" class="d-block mx-auto" />
              </div>
            </div>

            <!-- PANAH KIRI -->
            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#heroCarousel"
              data-bs-slide="prev"
            >
              <span class="carousel-control-prev-icon"></span>
            </button>

            <!-- PANAH KANAN -->
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#heroCarousel"
              data-bs-slide="next"
            >
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>

          <!-- FLOATING -->
          <div class="floating-btn">Class of '24</div>
        </div>

        <!-- RIGHT -->
        <div class="right">
          <h1>INFORMATICS</h1>
          <p class="subtitle">I'm a student from Syiah Kuala University.</p>

          <a href="profile.html" class="about-btn">More About Me</a>

          <br />

          <button
            class="btn btn-light mt-3"
            data-bs-toggle="modal"
            data-bs-target="#aboutModal"
          >
            Quick About
          </button>
        </div>
      </div>
    </section>

    <!-- MODAL -->
    <div class="modal fade" id="aboutModal">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">About Me</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <p>
              Saya mahasiswa Informatika Universitas Syiah Kuala yang tertarik
              pada UI Design dan Web Development.
            </p>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
